services:
  db:
    image: postgres:17-alpine
    container_name: sagar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sagar_ek_tools}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sagar_ek_tools}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sagar-backend
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      PROJECT_NAME: "Sagar EK Tools API"
      API_V1_STR: "/api/v1"
      CORS_ORIGINS: >-
        ["http://localhost:3000","http://127.0.0.1:3000"]
      ENVIRONMENT: "development"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sagar_ek_tools}"
    volumes:
      - ./backend:/app
      - backend_pycache:/app/__pycache__
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sagar-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
    volumes:
      - ./frontend:/app
      - frontend_nodemodules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  backend_pycache:
  frontend_nodemodules:
  frontend_next:

networks:
  app-network:
    driver: bridge
